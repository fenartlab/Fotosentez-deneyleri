<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fotosentez Deneyi — Deney Düzeneğini Kur</title>
<style>
:root {
  --green-dark: #1a6b3a;
  --green-mid: #2d9e5f;
  --green-light: #a8e6c2;
  --yellow: #f9d84e;
  --yellow-dark: #e6b800;
  --app-height: 100vh;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(160deg, #d4f0e2 0%, #b8e8d0 40%, #c9eaf8 100%);
  height: var(--app-height);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}
header {
  background: var(--green-dark);
  color: white;
  padding: 12px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 3px 12px rgba(0,0,0,0.18);
  flex-shrink: 0;
  gap: 12px;
}
header h1 { font-family: 'Trebuchet MS', sans-serif; font-size: 1.45rem; }
header .subtitle { font-size: 0.85rem; opacity: 0.78; margin-top: 1px; }
.btn-reset {
  background: var(--yellow);
  color: var(--green-dark);
  border: none;
  border-radius: 22px;
  padding: 8px 22px;
  font-weight: 800;
  font-size: 0.9rem;
  cursor: pointer;
}
.btn-reset:hover { background: var(--yellow-dark); }
.main { display: flex; flex: 1; min-height: 0; position: relative; }
.panel {
  width: 200px;
  min-width: 180px;
  background: rgba(255,255,255,0.82);
  border-right: 2.5px solid var(--green-light);
  padding: 14px 10px;
  display: flex;
  flex-direction: column;
}
.panel-handle { display: none; }
.panel-items {
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  touch-action: pan-y;
  flex: 1;
  min-height: 0;
}
.panel-title {
  font-family: 'Trebuchet MS', sans-serif;
  color: var(--green-dark);
  font-size: 1rem;
  text-align: center;
  padding-bottom: 8px;
  border-bottom: 2px dashed var(--green-light);
  margin-bottom: 4px;
}
.item {
  background: white;
  border: 2.5px solid var(--green-light);
  border-radius: 14px;
  padding: 8px 6px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(30,100,60,0.08);
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.item:hover { border-color: var(--green-mid); box-shadow: 0 4px 16px rgba(30,100,60,0.18); }
.item .emoji { font-size: 2.2rem; line-height: 1; }
.item .label { font-size: 0.72rem; font-weight: 700; color: var(--green-dark); text-align: center; line-height: 1.2; }
.canvas-area { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.scene-bg {
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 30% at 50% 90%, rgba(139,90,43,0.18) 0%, transparent 70%),
    linear-gradient(180deg, #c9eaf8 0%, #d4f0e2 45%, #8bc34a22 46%, #c8a96e55 75%, #a0784888 100%);
}
.sun {
  position: absolute; top: 20px; right: 60px;
  width: 80px; height: 80px;
  background: radial-gradient(circle, #fff7a0 30%, #f9d84e 70%, transparent 100%);
  border-radius: 50%;
  box-shadow: 0 0 0 12px rgba(249,216,78,0.22), 0 0 0 28px rgba(249,216,78,0.1);
}
.ground {
  position: absolute; bottom: 0; left: 0; right: 0; height: 38%;
  background: linear-gradient(180deg, #c8a96e 0%, #a07848 100%);
  border-top: 3px solid #8b6535;
}
.ground::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 18px;
  background: linear-gradient(90deg, #8bc34a 0%, #6ca82d 30%, #8bc34a 60%, #6ca82d 100%);
}
.cloud { position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); border-radius: 50%; }
.cloud-1 { width: 90px; height: 28px; top: 40px; left: 80px; }
.cloud-1::before { width: 44px; height: 44px; top: -22px; left: 12px; }
.cloud-1::after { width: 32px; height: 32px; top: -14px; left: 38px; }
.cloud-2 { width: 70px; height: 22px; top: 80px; left: 260px; opacity: 0.7; }
.cloud-2::before { width: 34px; height: 34px; top: -17px; left: 10px; }
.cloud-2::after { width: 26px; height: 26px; top: -11px; left: 30px; }
.scene-label {
  position: absolute; top: 14px; left: 16px;
  background: rgba(255,255,255,0.72);
  border: 2px dashed var(--green-mid);
  border-radius: 10px;
  padding: 5px 14px;
  font-size: 0.82rem; font-weight: 700; color: var(--green-dark);
}
/* Dropped items */
.dropped {
  position: absolute;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: grab;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.dropped:active { cursor: grabbing; }
.d-emoji { font-size: 2.6rem; line-height: 1; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.18)); pointer-events: none; }
.d-label {
  background: rgba(255,255,255,0.88);
  border-radius: 8px; padding: 1px 7px;
  font-size: 0.65rem; font-weight: 700;
  color: var(--green-dark); white-space: nowrap;
  pointer-events: none;
}
.d-remove {
  position: absolute; top: -8px; right: -8px;
  background: #e55; color: white; border: none;
  border-radius: 50%; width: 22px; height: 22px;
  font-size: 0.8rem; cursor: pointer;
  display: none; align-items: center; justify-content: center;
  font-weight: 900; z-index: 20;
  touch-action: manipulation;
}
.dropped:hover .d-remove { display: flex; }
.d-resize {
  position: absolute; bottom: -6px; right: -6px;
  width: 18px; height: 18px;
  background: var(--green-mid); border: 2px solid white;
  border-radius: 3px; cursor: se-resize;
  display: none; z-index: 20;
  touch-action: none;
}
.d-resize::after {
  content: ''; position: absolute; inset: 2px;
  border-right: 2px solid white; border-bottom: 2px solid white;
}
.dropped:hover .d-resize { display: block; }
/* Termometre / Lamba kontrol */
.ctrl-wrap { display: flex; align-items: center; gap: 6px; pointer-events: none; }
.ctrl-btns { display: flex; flex-direction: column; align-items: center; gap: 2px; pointer-events: auto; }
.ctrl-val {
  background: #fff; border: 2px solid var(--green-mid);
  border-radius: 8px; padding: 2px 8px;
  font-size: 0.9rem; font-weight: 800;
  min-width: 58px; text-align: center;
}
.ctrl-val.temp { color: #c0392b; }
.ctrl-val.light { color: #e67e00; }
.ctrl-btn {
  background: var(--green-mid); color: white;
  border: none; border-radius: 6px;
  width: 28px; height: 22px;
  font-size: 0.7rem; cursor: pointer; font-weight: 900;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.ctrl-btn:hover { background: var(--green-dark); }
.hint {
  position: absolute; bottom: 60px; left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.72);
  border: 2px dashed var(--green-mid);
  border-radius: 12px; padding: 7px 20px;
  font-size: 0.8rem; color: var(--green-dark);
  font-weight: 600; pointer-events: none;
  white-space: nowrap;
}
.hint-mobile { display: none; }

/* ── Mobil: malzeme paneli alttan açılan sürüklenebilir çekmece ── */
@media (max-width: 720px) {
  header { padding: 8px 12px; }
  header h1 { font-size: 1.02rem; line-height: 1.2; }
  header .subtitle { display: none; }
  .btn-reset { padding: 7px 14px; font-size: 0.78rem; white-space: nowrap; }
  .panel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    width: auto; min-width: 0;
    height: 74%;
    max-height: 74%;
    border-right: none;
    border-top: 2.5px solid var(--green-light);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -6px 20px rgba(0,0,0,0.2);
    background: rgba(255,255,255,0.97);
    padding: 0 12px calc(10px + env(safe-area-inset-bottom, 0px));
    transform: translateY(calc(100% - 54px));
    transition: transform 0.32s cubic-bezier(.25,.9,.35,1);
    z-index: 400;
    touch-action: none;
  }
  .panel.open { transform: translateY(0); }
  .panel-handle {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    flex-shrink: 0;
    cursor: grab;
    touch-action: none;
  }
  .panel-handle-bar {
    width: 46px; height: 5px;
    background: var(--green-light);
    border-radius: 3px;
  }
  .panel-title { flex-shrink: 0; padding-bottom: 6px; }
  .panel-items {
    flex-direction: row;
    flex-wrap: wrap;
    align-content: flex-start;
    touch-action: pan-y;
  }
  .item { width: 76px; }
  .hint-desktop { display: none; }
  .hint-mobile { display: inline; }
  .hint { bottom: 16px; white-space: normal; text-align: center; max-width: 80%; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>🌿 Fotosentez Deneyi — Deney Düzeneğini Kur</h1>
    <div class="subtitle">Malzemeleri sürükleyip deney alanına yerleştir</div>
  </div>
  <button class="btn-reset" onclick="resetAll()">🔄 Sıfırla</button>
</header>
<div class="main">
  <div class="panel" id="panel">
    <div class="panel-handle" id="panelHandle" role="button" tabindex="0" aria-label="Malzeme listesini aç/kapat"><span class="panel-handle-bar"></span></div>
    <div class="panel-title">🧪 Malzemeler</div>
    <div class="panel-items" id="panelItems"></div>
  </div>
  <div class="canvas-area" id="canvas">
    <div class="scene-bg"></div>
    <div class="sun"></div>
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="ground"></div>
    <div class="scene-label">📍 Deney Alanı</div>
    <div class="hint" id="hint">
      <span class="hint-desktop">⬅ Soldaki malzemeleri sürükleyip buraya bırak</span>
      <span class="hint-mobile">⬇ Alttaki çubuğa dokun, malzemeleri sürükleyip buraya bırak</span>
    </div>
  </div>
</div>

const panel      = document.getElementById('panel');
const panelItems = document.getElementById('panelItems');
const panelHandle = document.getElementById('panelHandle');
const canvas = document.getElementById('canvas');
const hint   = document.getElementById('hint');

// ── Panel item'larını oluştur ──────────────────────────────────
MATERIALS.forEach(mat => {
  const div = document.createElement('div');
  div.className = 'item';
  const renkMap = { kirmizi:'#ff4444', yesil:'#44cc44', mor:'#9b30ff' };
  const renkCSS = mat.renk ? `filter: drop-shadow(0 0 8px ${renkMap[mat.renk]});` : '';
  const bgCSS   = mat.renk ? `background:${renkMap[mat.renk]}22; border-color:${renkMap[mat.renk]};` : '';
  if (bgCSS) div.style.cssText += bgCSS;
  const visual = mat.img
    ? `<img src="${mat.img}" style="width:48px;height:48px;object-fit:contain;" draggable="false">`
    : `<span class="emoji" style="${renkCSS}">${mat.emoji}</span>`;
  div.innerHTML = `${visual}<span class="label">${mat.label}</span>`;

  // Panelden sürükleme — TOUCH
  div.addEventListener('touchstart', e => {
    e.preventDefault();
    div._touchActive = true;
    hint.style.opacity = '0';
    const t = e.touches[0];
    const rect = div.getBoundingClientRect();
    const offX = t.clientX - rect.left;
    const offY = t.clientY - rect.top;
    startPanelDrag(mat, t.clientX, t.clientY, offX, offY, 'touch');
    setTimeout(() => { div._touchActive = false; }, 500);
  }, { passive: false });

  // Panelden sürükleme — MOUSE (touch varsa çalışma)
  div.addEventListener('mousedown', e => {
    if (div._touchActive) return;
    e.preventDefault();
    hint.style.opacity = '0';
    const rect = div.getBoundingClientRect();
    const offX = e.clientX - rect.left;
    const offY = e.clientY - rect.top;
    startPanelDrag(mat, e.clientX, e.clientY, offX, offY, 'mouse');
  });

  panelItems.appendChild(div);
});

// ── Mobil alt çekmece: tutamacı sürükleyerek/tıklayarak aç-kapa ─
(function setupPanelDrawer() {
  let dragging = false, moved = false, startY = 0, startTranslate = 0;

  function isMobileLayout() {
    return window.matchMedia('(max-width: 720px)').matches;
  }
  function getTranslateY() {
    const st = getComputedStyle(panel).transform;
    if (st === 'none') return 0;
    const m = new DOMMatrixReadOnly(st);
    return m.m42;
  }
  function collapsedY() {
    return panel.offsetHeight - 54;
  }
  function setOpen(open) {
    panel.classList.toggle('open', open);
    panel.style.transform = '';
  }

  function onStart(clientY) {
    if (!isMobileLayout()) return;
    dragging = true; moved = false;
    startY = clientY;
    startTranslate = getTranslateY();
    panel.style.transition = 'none';
  }
  function onMove(clientY) {
    if (!dragging) return;
    const dy = clientY - startY;
    if (Math.abs(dy) > 4) moved = true;
    const ty = Math.max(0, Math.min(collapsedY(), startTranslate + dy));
    panel.style.transform = `translateY(${ty}px)`;
  }
  function onEnd(clientY) {
    if (!dragging) return;
    dragging = false;
    panel.style.transition = '';
    if (!moved) {
      panel.style.transform = '';
      setOpen(!panel.classList.contains('open'));
      return;
    }
    const dy = clientY - startY;
    const ty = Math.max(0, Math.min(collapsedY(), startTranslate + dy));
    panel.style.transform = '';
    setOpen(ty < collapsedY() / 2);
  }

  panelHandle.addEventListener('touchstart', e => { onStart(e.touches[0].clientY); }, { passive: true });
  panelHandle.addEventListener('touchmove', e => {
    if (dragging) e.preventDefault();
    onMove(e.touches[0].clientY);
  }, { passive: false });
  panelHandle.addEventListener('touchend', e => { onEnd(e.changedTouches[0].clientY); });

  panelHandle.addEventListener('mousedown', e => { onStart(e.clientY); });
  document.addEventListener('mousemove', e => { onMove(e.clientY); });
  document.addEventListener('mouseup', e => { onEnd(e.clientY); });

  panelHandle.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      setOpen(!panel.classList.contains('open'));
    }
  });

  window.addEventListener('resize', () => {
    if (!isMobileLayout()) panel.classList.remove('open');
  });
})();

// ── Panel sürükleme mantığı ────────────────────────────────────
function startPanelDrag(mat, startCX, startCY, offX, offY, mode) {
  const ghost = createGhost(mat);
  ghost.style.position = 'fixed';
  ghost.style.pointerEvents = 'none';
  ghost.style.zIndex = '9999';
  ghost.style.opacity = '0.75';
  ghost.style.transform = 'scale(1.05)';
  positionEl(ghost, startCX - offX, startCY - offY);
  document.body.appendChild(ghost);

  function onMove(cx, cy) {
    positionEl(ghost, cx - offX, cy - offY);
  }
  function onEnd(cx, cy) {
    ghost.remove();
    const cr = canvas.getBoundingClientRect();
    const overOpenDrawer = panel.classList.contains('open') && (() => {
      const pr = panel.getBoundingClientRect();
      return cx >= pr.left && cx <= pr.right && cy >= pr.top && cy <= pr.bottom;
    })();
    if (!overOpenDrawer && cx >= cr.left && cx <= cr.right && cy >= cr.top && cy <= cr.bottom) {
      spawnItem(mat, cx - cr.left - offX, cy - cr.top - offY);
      panel.classList.remove('open');
    }
  }

  if (mode === 'touch') {
    const mv = e => { e.preventDefault(); const t=e.touches[0]; onMove(t.clientX,t.clientY); };
    const up = e => { const t=e.changedTouches[0]; onEnd(t.clientX,t.clientY); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); };
    document.addEventListener('touchmove', mv, { passive:false });
    document.addEventListener('touchend', up);
  } else {
    const mv = e => { onMove(e.clientX, e.clientY); };
    const up = e => { onEnd(e.clientX, e.clientY); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
    document.addEventListener('mousemove', mv);
    document.addEventListener('mouseup', up);
  }
}

function positionEl(el, x, y) {
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
}

// ── Ghost oluştur ──────────────────────────────────────────────
function createGhost(mat) {
  const el = document.createElement('div');
  el.className = 'dropped';
  const size = mat.img ? 80 : 48;
  const vis = mat.img
    ? `<img class="d-visual" src="${mat.img}" style="width:${size}px;height:${size}px;object-fit:contain;" draggable="false">`
    : `<span class="d-emoji d-visual" style="font-size:${size*0.55}px;">${mat.emoji}</span>`;
  el.innerHTML = vis + `<span class="d-label">${mat.label}</span>`;
  return el;
}

// ── Canvas'a item yerleştir ────────────────────────────────────
function spawnItem(mat, x, y) {
  const el = document.createElement('div');
  el.className = 'dropped';
  const size = mat.img ? 80 : 48;
  el.dataset.size = size;
  el.dataset.isImg = mat.img ? '1' : '0';

  const vis = mat.img
    ? `<img class="d-visual" src="${mat.img}" style="width:${size}px;height:${size}px;object-fit:contain;" draggable="false">`
    : `<span class="d-emoji d-visual" style="font-size:${size*0.55}px;">${mat.emoji}</span>`;

  let inner = '';
  const renkMap = { kirmizi:'#ff4444', yesil:'#44cc44', mor:'#9b30ff' };
  const lambRenk = mat.renk ? renkMap[mat.renk] : 'rgba(255,220,50,0.9)';
  if (mat.renk && renkMap[mat.renk]) {
    el.style.outline = `3px solid ${renkMap[mat.renk]}`;
    el.style.borderRadius = '12px';
  }
  if (mat.special === 'light') {
    inner = `
      <div class="ctrl-wrap">
        ${vis}
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-action="light-up">▲</button>
          <span class="ctrl-val light" data-renk="${lambRenk}" style="color:${mat.renk ? renkMap[mat.renk] : '#e67e00'}">100%</span>
          <button class="ctrl-btn" data-action="light-dn">▼</button>
        </div>
      </div>`;
  } else if (mat.special === 'su') {
    inner = `
      <div class="ctrl-wrap">
        ${vis}
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-action="su-up">▲</button>
          <span class="ctrl-val" style="color:#1a8fe3;" data-action-type="su">50 mL</span>
          <button class="ctrl-btn" data-action="su-dn">▼</button>
        </div>
      </div>`;
  } else if (mat.special === 'co2') {
    inner = `
      <div class="ctrl-wrap">
        ${vis}
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-action="co2-up">▲</button>
          <span class="ctrl-val" style="color:#555;" data-action-type="co2">%0,04</span>
          <button class="ctrl-btn" data-action="co2-dn">▼</button>
        </div>
      </div>`;
  } else if (mat.special === 'temp') {
    inner = `
      <div class="ctrl-wrap">
        ${vis}
        <div class="ctrl-btns">
          <button class="ctrl-btn" data-action="temp-up">▲</button>
          <span class="ctrl-val temp">20°C</span>
          <button class="ctrl-btn" data-action="temp-dn">▼</button>
        </div>
      </div>`;
  } else {
    inner = vis;
  }

  el.innerHTML = `
    <button class="d-remove" onclick="this.closest('.dropped').remove()">✕</button>
    ${inner}
    <span class="d-label">${mat.label}</span>
    <div class="d-resize"></div>
  `;

  const cx = Math.max(0, Math.min(x, canvas.offsetWidth  - size - 20));
  const cy = Math.max(0, Math.min(y, canvas.offsetHeight - size - 20));
  el.style.left = cx + 'px';
  el.style.top  = cy + 'px';
  el.dataset.matId = mat.id;

  // Kontrol butonları
  el.querySelectorAll('.ctrl-btn').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); handleCtrl(btn, el); });
    btn.addEventListener('touchend', e => { e.stopPropagation(); e.preventDefault(); handleCtrl(btn, el); });
  });
  el.querySelector('.d-remove').addEventListener('touchend', e => { e.preventDefault(); el.remove(); });

  // İyot tıklama
  if (mat.id === 'iyot') {
    el.addEventListener('click', () => damlatIyot(el));
    el.addEventListener('touchend', e => { e.preventDefault(); damlatIyot(el); });
    el.style.cursor = 'pointer';
  }

  // Taşıma
  makeDraggable(el);
  // Boyutlandırma
  makeResizable(el);

  canvas.appendChild(el);
}

function handleCtrl(btn, el) {
  const action = btn.dataset.action;
  if (action === 'temp-up' || action === 'temp-dn') {
    const span = el.querySelector('.ctrl-val.temp');
    let v = parseInt(span.textContent);
    v = Math.max(-50, Math.min(70,  v + (action==='temp-up'?5:-5)));
    span.textContent = v + '°C';
  } else if (action === 'su-up' || action === 'su-dn') {
    const span = el.querySelector('[data-action-type="su"]');
    let v = parseInt(span.textContent);
    v = Math.max(10, Math.min(500, v + (action === 'su-up' ? 10 : -10)));
    span.textContent = v + ' mL';
  } else if (action === 'co2-up' || action === 'co2-dn') {
    const span = el.querySelector('[data-action-type="co2"]');
    const degerler = ['%0,04','%0,1','%0,5','%1','%2','%5','%10'];
    let idx = degerler.indexOf(span.textContent);
    if (action === 'co2-up') idx = Math.min(idx + 1, degerler.length - 1);
    else idx = Math.max(idx - 1, 0);
    span.textContent = degerler[idx];
  } else if (action === 'light-up' || action === 'light-dn') {
    const span = el.querySelector('.ctrl-val.light');
    const vis  = el.querySelector('.d-visual');
    let v = parseInt(span.textContent);
    v = Math.max(0, Math.min(100, v + (action==='light-up'?10:-10)));
    span.textContent = v + '%';
    const renk = span.dataset.renk || 'rgba(255,220,50,0.9)';
    if (vis) vis.style.filter = v===0 ? 'grayscale(1)' : `drop-shadow(0 0 ${Math.round(v/8)}px ${renk})`;
  }
}

// ── Taşıma ────────────────────────────────────────────────────
function makeDraggable(el) {
  function startDrag(startX, startY, mode) {
    const ox = parseInt(el.style.left) || 0;
    const oy = parseInt(el.style.top)  || 0;
    const W  = canvas.offsetWidth;
    const H  = canvas.offsetHeight;

    function clamp(x,y) {
      return [Math.max(0,Math.min(x,W-60)), Math.max(0,Math.min(y,H-60))];
    }

    if (mode === 'touch') {
      const mv = e => {
        e.preventDefault();
        const t=e.touches[0];
        const [nx,ny] = clamp(ox+t.clientX-startX, oy+t.clientY-startY);
        el.style.left=nx+'px'; el.style.top=ny+'px';
      };
      const up = () => { document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); };
      document.addEventListener('touchmove', mv, {passive:false});
      document.addEventListener('touchend', up);
    } else {
      const mv = e => {
        const [nx,ny] = clamp(ox+e.clientX-startX, oy+e.clientY-startY);
        el.style.left=nx+'px'; el.style.top=ny+'px';
      };
      const up = () => { document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    }
  }

  // Çift tıkla → en öne getir
  let lastTap = 0;
  el.addEventListener('dblclick', () => {
    document.querySelectorAll('.dropped').forEach(d => { if (parseInt(d.style.zIndex) > 10) d.style.zIndex = 10; });
    el.style.zIndex = 100;
  });
  el.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300) {
      document.querySelectorAll('.dropped').forEach(d => { if (parseInt(d.style.zIndex) > 10) d.style.zIndex = 10; });
      el.style.zIndex = 100;
    }
    lastTap = now;
  });

  el.addEventListener('mousedown', e => {
    if (e.target.closest('.d-remove,.d-resize,.ctrl-btn')) return;
    if (el._touchActive) return;
    e.preventDefault();
    startDrag(e.clientX, e.clientY, 'mouse');
  });

  el.addEventListener('touchstart', e => {
    if (e.target.closest('.d-remove,.d-resize,.ctrl-btn')) return;
    e.preventDefault();
    el._touchActive = true;
    setTimeout(() => { el._touchActive = false; }, 500);
    const t = e.touches[0];
    startDrag(t.clientX, t.clientY, 'touch');
  }, {passive:false});
}

// ── Boyutlandırma ──────────────────────────────────────────────
function makeResizable(el) {
  const handle = el.querySelector('.d-resize');

  function startResize(startX, mode) {
    const startSize = parseInt(el.dataset.size) || 80;
    const isImg = el.dataset.isImg === '1';

    function applySize(cx) {
      const size = Math.max(30, Math.min(300, startSize + cx - startX));
      el.dataset.size = size;
      const vis = el.querySelector('.d-visual');
      if (!vis) return;
      if (isImg) { vis.style.width=size+'px'; vis.style.height=size+'px'; }
      else { vis.style.fontSize=(size*0.55)+'px'; }
    }

    if (mode === 'touch') {
      const mv = e => { e.preventDefault(); applySize(e.touches[0].clientX); };
      const up = () => { document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',up); };
      document.addEventListener('touchmove', mv, {passive:false});
      document.addEventListener('touchend', up);
    } else {
      const mv = e => applySize(e.clientX);
      const up = () => { document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', up);
    }
  }

  handle.addEventListener('mousedown', e => { e.stopPropagation(); e.preventDefault(); startResize(e.clientX,'mouse'); });
  handle.addEventListener('touchstart', e => { e.stopPropagation(); e.preventDefault(); startResize(e.touches[0].clientX,'touch'); }, {passive:false});
}

// ── İyot damlatma ────────────────────────────────────────────
function damlatIyot(iyotEl) {
  const iyotRect = iyotEl.getBoundingClientRect();
  const iyotCX = iyotRect.left + iyotRect.width / 2;
  const damlaX = iyotCX - 6;
  const damlaBaslangicY = iyotRect.bottom;

  // Damla aşağı doğru düşer — canvas alt sınırına kadar
  const canvasRect = canvas.getBoundingClientRect();
  const damlaHedefY = canvasRect.bottom - 10;
  const sure = 600; // ms

  const damla = document.createElement('div');
  damla.style.cssText = `
    position:fixed;
    width:12px; height:16px;
    background:radial-gradient(ellipse, #6a0dad 30%, #4b0082 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    pointer-events:none;
    z-index:9999;
    left:${damlaX}px;
    top:${damlaBaslangicY}px;
    transition: top ${sure}ms linear, opacity 0.15s;
  `;
  document.body.appendChild(damla);

  // Damla harekete başlasın
  requestAnimationFrame(() => {
    damla.style.top = damlaHedefY + 'px';
  });

  // Her 16ms'de damlanın pozisyonunu kontrol et — yaprağa değdi mi?
  const baslangic = performance.now();
  let carptimi = false;

  function kontrol(now) {
    if (carptimi) return;
    const gecen = now - baslangic;
    const oran = Math.min(gecen / sure, 1);
    const damlaSimdikiY = damlaBaslangicY + (damlaHedefY - damlaBaslangicY) * oran;
    const damlaSimdikiBottom = damlaSimdikiY + 16;

    // Tüm dropped nesnelere bak
    document.querySelectorAll('.dropped').forEach(el => {
      if (carptimi) return;
      if (el === iyotEl) return; // iyotun kendisi sayılmasın
      const r = el.getBoundingClientRect();
      const xCakisti = damlaX + 12 > r.left && damlaX < r.right;
      const yCakisti = damlaSimdikiBottom > r.top && damlaSimdikiY < r.bottom;
      if (xCakisti && yCakisti) {
        carptimi = true;
        damla.style.transition = 'opacity 0.15s';
        damla.style.opacity = '0';
        setTimeout(() => damla.remove(), 150);
        // Sadece yeşil yapraksa renk değiştir
        if (el.dataset.matId === 'yaprak') moraDonustur(el);
      }
    });

    if (!carptimi && oran < 1) {
      requestAnimationFrame(kontrol);
    } else if (!carptimi) {
      // Hiçbir nesneye çarpmadı — yok ol
      damla.style.opacity = '0';
      setTimeout(() => damla.remove(), 150);
    }
  }

  requestAnimationFrame(kontrol);
}

function moraDonustur(yaprakEl) {
  // Zaten tam mora dönmüşse tekrar yapma
  if (yaprakEl.dataset.moraDonustu === '1') return;
  // Dönüşüm devam ediyorsa tekrar başlatma
  if (yaprakEl.dataset.moradonusuyor === '1') return;

  const img = yaprakEl.querySelector('.d-visual');
  if (!img) {
    console.warn('d-visual bulunamadı', yaprakEl.innerHTML);
    return;
  }

  yaprakEl.dataset.moradonusuyor = '1';
  let adim = 0;
  const toplamAdim = 50;
  const interval = setInterval(() => {
    adim++;
    const oran = adim / toplamAdim;
    // tek satırda filter — tarayıcı uyumluluğu için
    img.style.filter = `sepia(${oran}) hue-rotate(${220 * oran}deg) saturate(${1 + oran * 4}) brightness(${1 - oran * 0.1})`;
    if (adim >= toplamAdim) {
      clearInterval(interval);
      yaprakEl.dataset.moradonusuyor = '0';
      yaprakEl.dataset.moraDonustu = '1';
    }
  }, 35);
}

// ── Sıfırla ───────────────────────────────────────────────────
function resetAll() {
  document.querySelectorAll('.dropped').forEach(e=>e.remove());
  hint.style.opacity = '1';
  durdurFotosentez();
}


// ── Elodea baloncuk animasyonu ───────────────────────────────
function elodeaBaloncuk(elodeaEl, akvaryumEl, hiz = 0.5) {
  const er = elodeaEl.getBoundingClientRect();
  const ar = akvaryumEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();

  // Baloncuk elodeanın üst kısmından başlar
  const boyut = 5 + Math.round(hiz * 8) + Math.random() * 3;
  const sure  = Math.max(800, 2200 - hiz * 1200);

  const baloncuk = document.createElement('div');
  const x = er.left - cr.left + er.width * 0.4 + (Math.random() * 16 - 8);
  const y = er.top  - cr.top  + er.height * 0.2;

  // Akvaryum içinde yukarı doğru yükselir — akvaryumun üst sınırında durur
  const akvaryumUst = ar.top - cr.top + 8;
  const maxYukari = Math.max(20, y - akvaryumUst);

  baloncuk.style.cssText = `
    position:absolute;
    left:${x}px; top:${y}px;
    width:${boyut}px; height:${boyut}px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(180,230,255,0.5));
    border:1px solid rgba(100,180,255,0.8);
    pointer-events:none;
    z-index:50;
    opacity:0.9;
    transition: transform ${sure}ms ease-in-out, opacity ${sure * 0.8}ms ${sure * 0.2}ms ease-in;
  `;
  // Küçük olduğu için sadece O₂ yazısı, çok küçükse sadece baloncuk
  if (boyut >= 10) {
    baloncuk.innerHTML = `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${Math.max(5,boyut*0.4)}px;font-weight:800;color:rgba(30,100,180,0.9);pointer-events:none;">O₂</span>`;
  }
  canvas.appendChild(baloncuk);

  requestAnimationFrame(() => {
    const yan = (Math.random() - 0.5) * 12;
    baloncuk.style.transform = `translate(${yan}px, -${maxYukari}px)`;
    baloncuk.style.opacity = '0';
  });

  setTimeout(() => baloncuk.remove(), sure + 200);
}

// ── Fotosentez kontrol ────────────────────────────────────────
let fotosentezInterval = null;

function co2Oran(metin) {
  const map = {'%0,04':0.04,'%0,1':0.1,'%0,5':0.2,'%1':0.4,'%2':0.6,'%5':0.8,'%10':1.0};
  return map[metin] || 0;
}

// Sıcaklığa göre fotosentez çarpanı (enzim aktivitesi eğrisi)
// <=-50: 0 | -50→30: 0→1 (doğrusal artış) | 30→70: 1→0 (doğrusal düşüş) | >=70: 0
function sicaklikCarpan(derece) {
  if (derece <= -50) return 0;
  if (derece <= 30)  return (derece + 50) / 80;   // -50'den 30'a: 0→1
  if (derece <= 70)  return 1 - (derece - 30) / 40; // 30'dan 70'e: 1→0
  return 0;
}

// Fanus veya akvaryum üzerindeki termometrenin sıcaklık çarpanını al
function termometreCarpani(merkez) {
  const termometreler = nesnelerUzerinde(merkez, ['termometre']);
  if (!termometreler.length) return 1; // termometre yoksa sıcaklık etkisi yok
  const span = termometreler[0].querySelector('.ctrl-val.temp');
  if (!span) return 1;
  const derece = parseInt(span.textContent) || 20;
  return sicaklikCarpan(derece);
}

function renkCarpan(el) {
  const id = el.dataset.matId || '';
  if (id === 'lamba_mor')     return 1.0;   // mor — en fazla
  if (id === 'lamba_kirmizi') return 0.6;   // kırmızı — orta
  if (id === 'lamba_yesil')   return 0.2;   // yeşil — en az
  return 0.8; // beyaz lamba
}

// İki canvas-relative elementi çakışıyor mu?
function cakisiyor(a, b) {
  // Her iki elementin canvas üzerindeki gerçek piksel alanı
  const ar = a.getBoundingClientRect();
  const br = b.getBoundingClientRect();
  return !(ar.right < br.left || ar.left > br.right ||
           ar.bottom < br.top || ar.top > br.bottom);
}

function nesnelerUzerinde(merkez, matIdler) {
  return Array.from(document.querySelectorAll('.dropped')).filter(el =>
    el !== merkez && matIdler.includes(el.dataset.matId) && cakisiyor(merkez, el)
  );
}

function fotosentezKontrol() {
  const dropped = Array.from(document.querySelectorAll('.dropped'));

  // ── FANUS + SAKSI ─────────────────────────────────────────
  dropped.filter(el => el.dataset.matId === 'fanus').forEach(fanus => {
    const saksilar = nesnelerUzerinde(fanus, ['saksi']);
    if (!saksilar.length) return;

    const lambalar = nesnelerUzerinde(fanus, ['lamba','lamba_kirmizi','lamba_yesil','lamba_mor']);
    const isik = lambalar.reduce((max, el) => {
      const s = el.querySelector('.ctrl-val.light');
      const deger = s ? (parseInt(s.textContent)||0) : 0;
      return Math.max(max, (deger / 100) * renkCarpan(el));
    }, 0);
    if (isik === 0) return;

    const sular = nesnelerUzerinde(fanus, ['su']);
    const su = sular.reduce((max, el) => {
      const s = el.querySelector('[data-action-type="su"]');
      return Math.max(max, s ? (parseInt(s.textContent)||0) : 0);
    }, 0);
    if (su === 0) return;

    const co2ler = nesnelerUzerinde(fanus, ['co2']);
    const co2 = co2ler.reduce((max, el) => {
      const s = el.querySelector('[data-action-type="co2"]');
      return Math.max(max, s ? co2Oran(s.textContent) : 0);
    }, 0);
    if (co2 === 0) return;

    const kirec = nesnelerUzerinde(fanus, ['kirec_suyu']);
    if (kirec.length) return;

    const sicaklik = termometreCarpani(fanus);
    const hiz = isik * Math.min(su/200, 1) * co2 * sicaklik;
    if (hiz <= 0) return;
    const adet = Math.max(1, Math.round(hiz * 5));
    for (let i = 0; i < adet; i++) {
      setTimeout(() => baloncukUret(saksilar[0], hiz), i * 160);
    }
  });

  // ── AKVARYUM + ELODEA ─────────────────────────────────────
  dropped.filter(el => el.dataset.matId === 'akvaryum').forEach(akv => {
    const elodealar = nesnelerUzerinde(akv, ['bitki']);
    if (!elodealar.length) return;

    const lambalar = nesnelerUzerinde(akv, ['lamba','lamba_kirmizi','lamba_yesil','lamba_mor']);
    const isik = lambalar.reduce((max, el) => {
      const s = el.querySelector('.ctrl-val.light');
      const deger = s ? (parseInt(s.textContent)||0) : 0;
      return Math.max(max, (deger / 100) * renkCarpan(el));
    }, 0);
    if (isik === 0) return;

    const co2ler = nesnelerUzerinde(akv, ['co2']);
    const co2 = co2ler.reduce((max, el) => {
      const s = el.querySelector('[data-action-type="co2"]');
      return Math.max(max, s ? co2Oran(s.textContent) : 0);
    }, 0);
    if (co2 === 0) return;

    const kirec = nesnelerUzerinde(akv, ['kirec_suyu']);
    if (kirec.length) return;

    const sicaklik = termometreCarpani(akv);
    const hiz = isik * co2 * sicaklik;
    if (hiz <= 0) return;
    const adet = Math.max(1, Math.round(hiz * 5));
    for (let i = 0; i < adet; i++) {
      setTimeout(() => elodeaBaloncuk(elodealar[0], akv, hiz), i * 160);
    }
  });
}

// ── Mum - Baloncuk çarpışma ──────────────────────────────────
function izleBaloncuk(baloncuk) {
  const kontrol = setInterval(() => {
    if (!baloncuk.isConnected) { clearInterval(kontrol); return; }
    const br = baloncuk.getBoundingClientRect();
    const bcx = br.left + br.width  / 2;
    const bcy = br.top  + br.height / 2;

    document.querySelectorAll('.dropped').forEach(el => {
      if (el.dataset.matId !== 'mum') return;
      // Mumun alev bölgesi — üst %40
      const mr = el.getBoundingClientRect();
      const alevTop    = mr.top;
      const alevBottom = mr.top + mr.height * 0.45;
      const alevLeft   = mr.left + mr.width * 0.2;
      const alevRight  = mr.right - mr.width * 0.2;

      if (bcx >= alevLeft && bcx <= alevRight &&
          bcy >= alevTop  && bcy <= alevBottom) {
        mumParlat(el);
      }
    });
  }, 60);
}

function mumParlat(mumEl) {
  if (mumEl._parlıyor) return;
  mumEl._parlıyor = true;

  const img = mumEl.querySelector('.d-visual');
  if (!img) { mumEl._parlıyor = false; return; }

  // SVG içindeki alev grubunu bul
  const alev = img.contentDocument
    ? img.contentDocument.querySelector('.mum-alev')
    : img.getSVGDocument?.()?.querySelector('.mum-alev');

  if (alev) {
    // Inline SVG ise direkt çalış
    alev.style.transform = 'scale(2.2)';
    alev.style.filter = 'drop-shadow(0 0 10px rgba(255,160,0,1)) brightness(1.4)';
    setTimeout(() => {
      alev.style.transform = 'scale(1)';
      alev.style.filter = '';
      setTimeout(() => { mumEl._parlıyor = false; }, 200);
    }, 600);
  } else {
    // SVG base64 img olduğu için CSS filter ile tüm img'e uygula
    // Ama sadece alev büyüsün diye clip-path ile üst kısma uygula
    img.style.transition = 'filter 0.15s';
    img.style.filter = 'drop-shadow(0 0 12px rgba(255,160,0,0.95)) drop-shadow(0 0 6px rgba(255,220,50,0.9)) brightness(1.25)';

    // Mumun üst %45'ini kaplayan bir parlama overlay ekle
    const overlay = document.createElement('div');
    const ir = img.getBoundingClientRect();
    const cr = mumEl.closest('#canvas')?.getBoundingClientRect() || {left:0,top:0};
    const ox = parseFloat(mumEl.style.left)||0;
    const oy = parseFloat(mumEl.style.top)||0;
    const iw = img.offsetWidth  || 80;
    const ih = img.offsetHeight || 80;
    overlay.style.cssText = `
      position:absolute;
      left:${ox - iw * 0.4}px;
      top:${oy - ih * 0.5}px;
      width:${iw * 1.8}px;
      height:${ih * 0.55}px;
      border-radius:50%;
      background:radial-gradient(ellipse, rgba(255,180,0,0.55) 0%, transparent 70%);
      pointer-events:none;
      z-index:49;
      animation: alevParla 0.6s ease-out forwards;
    `;
    mumEl.closest('#canvas')?.appendChild(overlay);
    setTimeout(() => overlay.remove(), 650);

    setTimeout(() => {
      img.style.filter = '';
      setTimeout(() => { mumEl._parlıyor = false; }, 200);
    }, 600);
  }
}

function baslatFotosentez() {
  if (fotosentezInterval) return;
  fotosentezInterval = setInterval(fotosentezKontrol, 700);
}

function durdurFotosentez() {
  clearInterval(fotosentezInterval);
  fotosentezInterval = null;
}

function baloncukUret(saksiEl, hiz = 0.5) {
  const cr = canvas.getBoundingClientRect();
  const r  = saksiEl.getBoundingClientRect();
  const boyut = 8 + Math.round(hiz * 12) + Math.random() * 4;
  const sure  = Math.max(1200, 2800 - hiz * 1400);
  const x = r.left - cr.left + r.width  * 0.45 + (Math.random() * 24 - 12);
  const y = r.top  - cr.top  + r.height * 0.15;
  const b = document.createElement('div');
  b.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${boyut}px;height:${boyut}px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.92),rgba(150,220,255,.55));border:1.5px solid rgba(100,180,255,.75);pointer-events:none;z-index:50;opacity:.9;transition:transform ${sure}ms ease-in-out,opacity ${sure}ms ease-in;`;
  b.innerHTML = `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${Math.max(6,boyut*.42)}px;font-weight:800;color:rgba(30,100,180,.9);pointer-events:none;">O₂</span>`;
  canvas.appendChild(b);
  requestAnimationFrame(() => {
    b.style.transform = `translate(${(Math.random()-.5)*36}px,-${y+60+Math.random()*80}px)`;
    b.style.opacity = '0';
  });
  // Hareket boyunca mum çarpışması kontrolü
  izleBaloncuk(b);
  setTimeout(() => b.remove(), sure + 200);
}

function elodeaBaloncuk(elodeaEl, akvaryumEl, hiz = 0.5) {
  const cr = canvas.getBoundingClientRect();
  const er = elodeaEl.getBoundingClientRect();
  const ar = akvaryumEl.getBoundingClientRect();
  const boyut = 5 + Math.round(hiz * 8) + Math.random() * 3;
  const sure  = Math.max(800, 2200 - hiz * 1200);
  const x = er.left - cr.left + er.width  * 0.4 + (Math.random() * 16 - 8);
  const y = er.top  - cr.top  + er.height * 0.2;
  const maxYukari = Math.max(20, y - (ar.top - cr.top + 8));
  const b = document.createElement('div');
  b.style.cssText = `position:absolute;left:${x}px;top:${y}px;width:${boyut}px;height:${boyut}px;border-radius:50%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(180,230,255,.5));border:1px solid rgba(100,180,255,.8);pointer-events:none;z-index:50;opacity:.9;transition:transform ${sure}ms ease-in-out,opacity ${sure*.8}ms ${sure*.2}ms ease-in;`;
  if (boyut >= 10) b.innerHTML = `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:${Math.max(5,boyut*.4)}px;font-weight:800;color:rgba(30,100,180,.9);pointer-events:none;">O₂</span>`;
  canvas.appendChild(b);
  requestAnimationFrame(() => {
    b.style.transform = `translate(${(Math.random()-.5)*12}px,-${maxYukari}px)`;
    b.style.opacity = '0';
  });
  izleBaloncuk(b);
  setTimeout(() => b.remove(), sure + 200);
}


// Başlat
baslatFotosentez();
</script>
